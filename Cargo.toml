[package]
name = "lookat"
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "LookAt: a native Horizon mod showing what is under the crosshair as a vanilla tooltip."
publish = false

# LookAt's game-independent logic and its tests: mixins/lookat/runtime.rs, the
# same file the bundle adds to the game as `crate::game::lookat`. The adapter
# to the game, native.rs, only compiles inside Horizon.
[lib]
path = "src/lib.rs"

